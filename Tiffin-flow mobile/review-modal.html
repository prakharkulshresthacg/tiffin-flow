<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Your Meal - TiffinFlow</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .review-dialog-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: rgba(25, 22, 17, 0.52);
      backdrop-filter: blur(4px);
    }
    .review-dialog {
      background: var(--white);
      border-radius: 26px 26px 0 0;
      padding: 12px 20px 32px;
      box-shadow: 0 -16px 50px rgba(0, 0, 0, 0.22);
      width: 100%;
    }
    .rating-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .rating-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-green);
    }
    .scale-group {
      display: flex;
      gap: 6px;
    }
    .scale-input {
      display: none;
    }
    .scale-label {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-cream-warm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s;
    }
    .scale-input:checked + .scale-label {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: var(--white);
      box-shadow: 0 3px 8px rgba(239, 106, 50, 0.3);
    }
    .star-rating {
      display: flex;
      gap: 8px;
      margin: 8px 0 16px;
    }
    .star-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #D6D3D1;
      cursor: pointer;
      transition: all 0.2s;
    }
    .star-btn:hover, .star-btn.active {
      color: #E98343;
      background: #FFF5EE;
      border-color: #E98343;
    }
    .feedback-textarea {
      width: 100%;
      height: 95px;
      border: 1.1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-dark);
      background: var(--white);
      outline: none;
      resize: none;
      transition: all 0.2s;
    }
    .feedback-textarea:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px var(--accent-orange-soft);
    }
  </style>
</head>
<body style="background: rgba(25, 22, 17, 0.7);">
  <div class="app-container" style="background: transparent;">
    <div class="review-dialog-container">
      <div class="review-dialog">
        <div class="modal-grab-bar"></div>

        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
          <div>
            <span class="eyebrow" style="color: var(--primary-green-light);">COMPLETED MEAL</span>
            <h2 style="font-family: var(--font-heading); font-size: 20px; font-weight: 800; color: var(--primary-green); margin-top: 2px;">How was your meal?</h2>
          </div>
          <a href="subscription.html" class="icon-btn bordered" title="Close" style="width: 32px; height: 32px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </a>
        </div>

        <form action="subscription.html" method="get">
          <!-- Overall Rating -->
          <div style="margin-bottom: 18px;">
            <label class="form-label">Overall Rating</label>
            <div class="star-rating">
              <span class="star-btn active">★</span>
              <span class="star-btn active">★</span>
              <span class="star-btn active">★</span>
              <span class="star-btn active">★</span>
              <span class="star-btn active">★</span>
            </div>
          </div>

          <!-- Food Quality -->
          <div class="rating-row">
            <span class="rating-title">Food Quality</span>
            <div class="scale-group">
              <input type="radio" name="fq" id="fq1" class="scale-input"><label for="fq1" class="scale-label">1</label>
              <input type="radio" name="fq" id="fq2" class="scale-input"><label for="fq2" class="scale-label">2</label>
              <input type="radio" name="fq" id="fq3" class="scale-input"><label for="fq3" class="scale-label">3</label>
              <input type="radio" name="fq" id="fq4" class="scale-input"><label for="fq4" class="scale-label">4</label>
              <input type="radio" name="fq" id="fq5" class="scale-input" checked><label for="fq5" class="scale-label">5</label>
            </div>
          </div>

          <!-- Delivery -->
          <div class="rating-row">
            <span class="rating-title">Delivery</span>
            <div class="scale-group">
              <input type="radio" name="del" id="del1" class="scale-input"><label for="del1" class="scale-label">1</label>
              <input type="radio" name="del" id="del2" class="scale-input"><label for="del2" class="scale-label">2</label>
              <input type="radio" name="del" id="del3" class="scale-input"><label for="del3" class="scale-label">3</label>
              <input type="radio" name="del" id="del4" class="scale-input"><label for="del4" class="scale-label">4</label>
              <input type="radio" name="del" id="del5" class="scale-input" checked><label for="del5" class="scale-label">5</label>
            </div>
          </div>

          <!-- Packaging -->
          <div class="rating-row">
            <span class="rating-title">Packaging</span>
            <div class="scale-group">
              <input type="radio" name="pkg" id="pkg1" class="scale-input"><label for="pkg1" class="scale-label">1</label>
              <input type="radio" name="pkg" id="pkg2" class="scale-input"><label for="pkg2" class="scale-label">2</label>
              <input type="radio" name="pkg" id="pkg3" class="scale-input"><label for="pkg3" class="scale-label">3</label>
              <input type="radio" name="pkg" id="pkg4" class="scale-input"><label for="pkg4" class="scale-label">4</label>
              <input type="radio" name="pkg" id="pkg5" class="scale-input" checked><label for="pkg5" class="scale-label">5</label>
            </div>
          </div>

          <!-- Vendor -->
          <div class="rating-row">
            <span class="rating-title">Vendor</span>
            <div class="scale-group">
              <input type="radio" name="ven" id="ven1" class="scale-input"><label for="ven1" class="scale-label">1</label>
              <input type="radio" name="ven" id="ven2" class="scale-input"><label for="ven2" class="scale-label">2</label>
              <input type="radio" name="ven" id="ven3" class="scale-input"><label for="ven3" class="scale-label">3</label>
              <input type="radio" name="ven" id="ven4" class="scale-input"><label for="ven4" class="scale-label">4</label>
              <input type="radio" name="ven" id="ven5" class="scale-input" checked><label for="ven5" class="scale-label">5</label>
            </div>
          </div>

          <!-- Textarea -->
          <div class="form-group" style="margin-top: 14px; margin-bottom: 12px;">
            <label class="form-label">Your review</label>
            <textarea class="feedback-textarea" placeholder="Tell us what felt good, or what could be better.">The paneer tikka thali was fresh, warm, and comforting! Loved the phulkas and home-cooked dal.</textarea>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 11px; color: var(--text-muted);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2F7057" stroke-width="2.5">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>Only completed meals can receive a Verified Meal review.</span>
          </div>

          <button type="submit" class="btn btn-forest" style="background: var(--primary-green);">Submit Feedback</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
