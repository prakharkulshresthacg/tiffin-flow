<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - TiffinFlow</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--accent-orange-dark);
      font-weight: 800;
      text-decoration: none;
    }
    .pref-section {
      margin-top: 6px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <a href="login.html" class="icon-btn bordered" title="Go back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          </svg>
        </span>
        <span>Tiffin<span class="accent-flow">Flow</span></span>
      </a>
      <div style="width: 38px;"></div>
    </header>

    <!-- Content -->
    <main class="app-content">
      <div style="margin-bottom: 18px;">
        <h1 class="page-title" style="font-size: 26px;">Create your account</h1>
        <p class="page-subtitle">Let's make your meals fit your life.</p>
      </div>

      <form action="plans.html" method="get">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="input-box" placeholder="Your full name" required value="Prakhar Saxena">
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="input-box" placeholder="you@email.com" required value="prakhar@tiffingroup.com">
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="input-box" placeholder="+91 98765 43210" required value="+91 98765 43210">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-with-action">
            <input type="password" class="input-box" placeholder="Create a strong password" required value="••••••••••••">
            <button type="button" class="input-action-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-with-action">
            <input type="password" class="input-box" placeholder="Confirm Password" required value="••••••••••••">
            <button type="button" class="input-action-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Food Preference Chips -->
        <div class="pref-section">
          <label class="form-label">Food preference</label>
          <div class="chip-group">
            <input type="radio" id="veg" name="food_pref" class="chip-input veg-input" checked>
            <label for="veg" class="chip-label">
              <span class="chip-dot"></span>
              Veg
            </label>

            <input type="radio" id="nonveg" name="food_pref" class="chip-input nonveg-input">
            <label for="nonveg" class="chip-label">
              <span class="chip-dot"></span>
              Non-Veg
            </label>

            <input type="radio" id="jain" name="food_pref" class="chip-input jain-input">
            <label for="jain" class="chip-label">
              <span class="chip-dot"></span>
              Jain
            </label>
          </div>
        </div>

        <!-- Meal Preference Chips -->
        <div class="pref-section">
          <label class="form-label">Preferred meal slot</label>
          <div class="chip-group">
            <input type="radio" id="lunch" name="meal_slot" class="chip-input" checked>
            <label for="lunch" class="chip-label">
              <span class="chip-dot"></span>
              Lunch
            </label>

            <input type="radio" id="dinner" name="meal_slot" class="chip-input">
            <label for="dinner" class="chip-label">
              <span class="chip-dot"></span>
              Dinner
            </label>

            <input type="radio" id="both" name="meal_slot" class="chip-input">
            <label for="both" class="chip-label">
              <span class="chip-dot"></span>
              Both
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Create Account</button>
      </form>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button type="button" class="btn-social">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#000000">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.64 1.35-.57.65-1.06 1.72-.93 2.74 1 .08 2.03-.49 2.65-1.24z"/>
          </svg>
          Apple
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </main>
  </div>
</body>
</html>
